name: Build hgkiller dylib

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile geometry tests and iOS dylib
        run: bash scripts/build.sh
      - name: Test UIKit layout convergence on simulator
        run: bash scripts/test-uikit.sh
      - name: Upload hgkiller
        uses: actions/upload-artifact@v4
        with:
          name: hgkiller-dylib-${{ github.run_number }}
          path: |
            build/hgkiller.dylib
            build/SHA256SUMS.txt
            build/uikit-regression-results.json
          if-no-files-found: error
